name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'   # quét dependency mỗi thứ Hai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: '3.11'

jobs:
  # ===========================================================================
  # JOB 1 — BẢO MẬT (chạy trước, fail nhanh)
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks cần toàn bộ lịch sử

      - name: Quét secret trong lịch sử git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Cài công cụ bảo mật
        run: pip install bandit[toml] pip-audit

      - name: Bandit — quét lỗ hổng (tầng nền + dashboard)
        run: |
          bandit -r forecast_system/core forecast_system/pipeline \
                    forecast_system/config forecast_system/dashboard \
                 -c pyproject.toml -ll

      - name: pip-audit — quét CVE trong dependency
        run: pip-audit --strict --desc
        continue-on-error: true   # cảnh báo, chưa block; siết sau khi vá xong backlog

  # ===========================================================================
  # JOB 2 — CHẤT LƯỢNG CODE
  # ===========================================================================
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check forecast_system tests --output-format=github

      - name: Ruff — kiểm tra format (tầng nền + code mới)
        run: |
          ruff format --check \
            forecast_system/core forecast_system/pipeline tests

      - name: Mypy — type check (tầng nền, siết dần sang legacy)
        run: mypy forecast_system/core forecast_system/pipeline forecast_system/config

      - name: Báo cáo độ phức tạp (không block)
        run: |
          pip install radon
          echo "### Hàm có complexity > C" >> $GITHUB_STEP_SUMMARY
          radon cc forecast_system -s -n C >> $GITHUB_STEP_SUMMARY || true

  # ===========================================================================
  # JOB 3 — TEST TRÊN NHIỀU PHIÊN BẢN PYTHON
  # ===========================================================================
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Pytest + coverage
        run: |
          pytest -m "not integration and not slow" \
                 --cov --cov-report=xml --cov-report=term-missing \
                 --cov-fail-under=40

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # JOB 4 — BUILD IMAGE (chỉ khi mọi job trên pass)
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security, quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: forecast-system:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — quét lỗ hổng image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: forecast-system:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
