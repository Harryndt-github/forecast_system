# Cài đặt một lần:  pre-commit install
# Chạy toàn bộ:     pre-commit run --all-files
#
# Lớp phòng thủ ĐẦU TIÊN: chặn secret trước khi nó vào lịch sử git.
# Khi secret đã commit thì phải xoay vòng credential — xem SECURITY.md.

default_language_version:
  python: python3.11

repos:
  # ==========================================================================
  # BẢO MẬT — ưu tiên cao nhất
  # ==========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "🔐 gitleaks — chặn secret"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: "🔐 bandit — quét lỗ hổng"
        args: ["-c", "pyproject.toml", "-ll"]
        additional_dependencies: ["bandit[toml]"]

  # ==========================================================================
  # AN TOÀN FILE
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-added-large-files
        args: ["--maxkb=1000"]      # chặn model/dataset lọt vào git
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ==========================================================================
  # CHẤT LƯỢNG CODE
  # ==========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: "🧹 ruff — lint"
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
        name: "🧹 ruff — format"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "🔎 mypy — type check"
        files: ^forecast_system/
        additional_dependencies: [types-requests, pandas-stubs]
        args: ["--ignore-missing-imports"]

  # ==========================================================================
  # COMMIT MESSAGE — Conventional Commits
  # ==========================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, perf, test, build, ci, chore, revert]
