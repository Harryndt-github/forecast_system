[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ==============================================================================
# PACKAGE METADATA
# ==============================================================================
[project]
name = "forecast-system"
version = "9.0.0"
description = "Hệ thống dự báo lượng khách nhà hàng đa tầng (ML ensemble + LLM + RAG)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Data & AI Team" }]
keywords = ["forecasting", "time-series", "ensemble", "llm", "rag", "mlops"]

classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Dependency được pin theo dải tương thích (major-safe).
# Bản khoá chính xác nằm ở requirements.lock — dùng file đó khi build image.
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "holidays>=0.40,<1.0",
    "lunardate>=0.2,<1.0",
    "tqdm>=4.66,<5.0",
    "openpyxl>=3.1,<4.0",
    "xlsxwriter>=3.1,<4.0",
    "scikit-learn>=1.3,<2.0",
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.1,<5.0",
    "catboost>=1.2,<2.0",
    "prophet>=1.1,<2.0",
    "neuralprophet>=0.8,<1.0",
]
llm = [
    "openai>=1.30,<2.0",
    "chromadb>=0.5,<2.0",
    "sentence-transformers>=3.0,<6.0",
]
serve = ["gunicorn>=22.0,<24.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "bandit[toml]>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.8,<5.0",
    "types-requests",
    "pandas-stubs",
]

[project.scripts]
forecast-run = "forecast_system.pipeline.orchestrator:cli"
forecast-dashboard = "forecast_system.dashboard.app:run_dashboard"

[tool.setuptools.packages.find]
where = ["."]
include = ["forecast_system*"]
exclude = ["tests*", "docs*"]

# ==============================================================================
# RUFF — linter + formatter (thay thế flake8 + isort + black)
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv", "build", "dist", "__pycache__", "docs",
    # File legacy dùng cú pháp f-string lồng dấu nháy của Python 3.12,
    # ruff không parse được ở target py310. Sẽ sửa khi refactor scripts/.
    "forecast_system/scripts/generate_macro_analysis_excel.py",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort — thứ tự import
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear — bẫy logic phổ biến
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # dùng pathlib thay os.path
    "T20",       # ⚠️ CẤM print() — bắt buộc dùng logger
    "BLE",       # ⚠️ CẤM except Exception trần (blind except)
    "TRY",       # chuẩn hoá try/except
    "S",         # bandit — security
    "ARG",       # tham số không dùng
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "E501",     # đã có formatter lo độ dài dòng
    "TRY003",   # cho phép message dài trong exception
    "PLR0913",  # nhiều tham số — sẽ siết dần khi refactor xong
    "RUF001", "RUF002", "RUF003",  # comment/docstring tiếng Việt có dấu
]

# ==============================================================================
# CHIẾN LƯỢC SIẾT DẦN
# ------------------------------------------------------------------------------
# Codebase có sẵn ~35k dòng. Bật toàn bộ quy tắc một lượt sẽ tạo ra hàng nghìn
# lỗi và không ai sửa nổi -> CI bị vô hiệu hoá trên thực tế.
#
# Cách làm: quy tắc bật ĐẦY ĐỦ cho tầng nền (config/, core/, pipeline/, utils/)
# và cho mọi code MỚI. Module legacy được miễn tạm thời, gỡ dần từng dòng
# trong bảng dưới khi refactor xong -> tiến độ đo được, không hồi quy.
#
# Lộ trình: ARCHITECTURE.md §4 Giai đoạn 3.
# ==============================================================================
[tool.ruff.lint.per-file-ignores]
"tests/**"       = ["S101", "PLR2004", "ARG", "PLC0415", "S603", "S607"]
"**/__init__.py" = ["F401"]

# --- MIỄN TRỪ TẠM THỜI cho code legacy (gỡ dần khi refactor) -----------------
# T20 = print()   BLE = except Exception trần   C901/PLR = quá phức tạp
"forecast_system/main.py"             = ["ALL"]
"forecast_system/backtest.py"         = ["ALL"]
"forecast_system/update_results.py"   = ["ALL"]
"forecast_system/scheduler.py"        = ["ALL"]
"forecast_system/parallel_engine.py"  = ["ALL"]
"forecast_system/forecast_fb.py"      = ["T20"]
"forecast_system/agents/**"           = ["ALL"]
"forecast_system/ishushi/**"          = ["ALL"]
"forecast_system/scripts/**"          = ["ALL"]
"forecast_system/utils/**"            = ["ALL"]
# Dashboard: import cục bộ là có chủ đích (lazy-load pandas/agents khi cần).
# S104 chỉ xuất hiện trong chuỗi help của argparse, không phải bind thật.
"forecast_system/dashboard/app.py"    = ["BLE", "TRY", "C901", "PLR", "T20", "PTH",
                                          "SIM", "B", "ARG", "UP", "N", "RUF046",
                                          "PLC0415", "S104", "W293", "I001"]
# settings.py: global cho lazy-cache DB config, import cục bộ cho urllib (chỉ
# dùng trong 1 hàm). Cả hai đều có chủ đích, xem docstring trong file.
"forecast_system/config/settings.py"  = ["PLR", "PTH", "TRY", "UP", "PLW0603", "PLC0415"]


[tool.ruff.lint.mccabe]
max-complexity = 12          # ngưỡng mục tiêu; xem docs/refactor-plan cho lộ trình

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 60

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# MYPY — type checking (siết dần theo module)
# ==============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["^build/", "^dist/", "^\\.venv/"]
# Không đi sâu vào module legacy khi type-check tầng nền
follow_imports = "silent"

# Tầng nền tảng: yêu cầu strict ngay từ đầu
[[tool.mypy.overrides]]
module = ["forecast_system.config.*", "forecast_system.core.*", "forecast_system.pipeline.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

# Tầng legacy: chưa enforce. Gỡ ignore_errors theo từng module khi migrate xong.
# Lộ trình: ARCHITECTURE.md §4 Giai đoạn 3.
[[tool.mypy.overrides]]
module = [
    "forecast_system.agents.*",
    "forecast_system.ishushi.*",
    "forecast_system.utils.*",
    "forecast_system.dashboard.*",
    "forecast_system.main",
    "forecast_system.backtest",
    "forecast_system.scheduler",
    "forecast_system.parallel_engine",
    "forecast_system.update_results",
    "forecast_system.forecast_fb",
    "forecast_system.scripts.*",
]
ignore_errors = true

# Thư viện bên thứ ba không có stub
[[tool.mypy.overrides]]
module = [
    "prophet.*", "neuralprophet.*", "lightgbm.*", "xgboost.*",
    "catboost.*", "chromadb.*", "sentence_transformers.*",
    "lunardate.*", "holidays.*",
]
ignore_missing_imports = true

# ==============================================================================
# PYTEST
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "unit: test thuần, không I/O",
    "integration: cần DB hoặc dịch vụ ngoài",
    "slow: chạy > 5 giây",
]
filterwarnings = ["error::DeprecationWarning:forecast_system.*"]

# Coverage CHỈ tính tầng đang được phát triển theo chuẩn mới.
# Legacy (main.py, agents/, ishushi/) chưa tính vào ngưỡng — sẽ đưa vào dần
# khi từng module được migrate sang kiến trúc stage.
[tool.coverage.run]
branch = true
source = ["forecast_system/core", "forecast_system/pipeline", "forecast_system/config"]
omit = ["*/tests/*", "*/__init__.py", "*/dashboard/static/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 40          # ngưỡng khởi điểm, nâng dần mỗi sprint

# ==============================================================================
# BANDIT — security scan
# ==============================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
skips = ["B101"]         # assert_used — chấp nhận trong code nội bộ
